<!DOCTYPE html>
<html>
<head>
    <title>AI Research Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .loading {
            margin-top: 15px;
            color: #888;
        }

        .summary-box {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 15px;
        }

        .source-link {
            display: block;
            color: blue;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Research Agent (MCP System)</h1>

    <!-- INPUT UI -->
    <div class="search-box">
        <input type="text" id="query" placeholder="Ask anything...">
        <button onclick="search()">Search</button>
    </div>

    <!-- LOADING -->
    <div id="loading" class="loading"></div>

    <!-- RESULT -->
    <div id="summary" class="summary-box"></div>

    <!-- SOURCES -->
    <div id="sources" class="sources"></div>

</div>

<script>
async function search() {

    let query = document.getElementById("query").value;

    if (!query) return;

    // UI updates
    document.getElementById("loading").innerText = "🔍 Searching and analyzing...";
    document.getElementById("summary").innerText = "";
    document.getElementById("sources").innerHTML = "";

    try {
        // CALL YOUR RENDER BACKEND
        let res = await fetch("https://mcp-powered-deep-research-multi-ai-agent.onrender.com/agent/query", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ query: query })
        });

        let data = await res.json();

        document.getElementById("loading").innerText = "";

        // SHOW SUMMARY
        document.getElementById("summary").innerText =
            data.summary || data.error || "No response received";

        // SHOW SOURCES
        let sourcesDiv = document.getElementById("sources");
        sourcesDiv.innerHTML = "<h3>Sources:</h3>";

        if (data.sources) {
            data.sources.forEach(url => {
                let link = document.createElement("a");
                link.href = url;
                link.innerText = url;
                link.target = "_blank";
                link.className = "source-link";
                sourcesDiv.appendChild(link);
            });
        }

    } catch (err) {
        document.getElementById("loading").innerText = "";
        document.getElementById("summary").innerText =
            "Error: Unable to connect to backend";
        console.error(err);
    }
}
</script>

</body>
</html>
